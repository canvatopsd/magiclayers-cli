[package]
name = "magiclayers-cli"
version = "2.6.1"
edition = "2024"
publish = false

[[bin]]
name = "magiclayers"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "zstd", "multipart"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = "2"

serde = { version = "1", features = ["derive"] }
dirs = "6"
hex = "0.4"
rand = "0.9"
